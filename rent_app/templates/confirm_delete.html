{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white fw-bold">Confirm Deletion</div>
            <div class="card-body text-center p-4">
                <h4 class="text-danger mb-3"><i class="bi bi-exclamation-triangle"></i> Warning</h4>
                <p>Are you sure you want to permanently delete <strong>"{{ object }}"</strong>?</p>
                <p class="text-muted small">This action cannot be undone.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
